    question: Which driver retired from the most races?
    expect:
      answer: [Andrea de Cesaris, "137"]
      tools: [query_stats]
    sql: SELECT driver_name, dnfs FROM v_driver_career ORDER BY dnfs DESC LIMIT 1

  - id: stats-most-wins-without-title
