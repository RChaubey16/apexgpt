    category: seasons
    question: How many poles did Ayrton Senna take in 1988?
    expect:
      answer: ["13"]
      tools: [query_stats]
    sql: >-
      SELECT count(*) FROM results r JOIN races ra USING (race_id) JOIN drivers d USING (driver_id)
      WHERE r.grid = 1 AND d.ref = 'senna' AND ra.season = 1988
    known_issue: >-
      The stats views have no per-season poles; answered 7 (wins from pole) in the
      F4.2 check. The reference query reads the base tables.

