        - The Michelin tyres were found to be unsafe for the banked final turn
        - The Michelin-shod teams pulled into the pits after the formation lap
        - Only the six cars on Bridgestone tyres raced
        - Michael Schumacher won
      sources: [2005 United States Grand Prix]
      tools: [search_f1_knowledge]

  - id: races-2011-canada
    category: races
    question: What happened at the 2011 Canadian Grand Prix?
    expect:
      answer: [Jenson Button]
      facts:
        - Heavy rain caused a long red-flag stoppage
        - It became the longest race in Formula 1 history
        - Button won after passing Vettel on the final lap
      sources: [2011 Canadian Grand Prix]
      tools: [search_f1_knowledge]
    sql: >-
      SELECT driver_name FROM v_race_winners
      WHERE season = 2011 AND race_name = 'Canadian Grand Prix'

  - id: races-1982-swiss-gp
