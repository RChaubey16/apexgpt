    expect:
      answer: [Giancarlo Fisichella]
      facts:
        - The race was stopped with a red flag after crashes
        - Räikkönen was first declared the winner, but Fisichella was awarded the win afterwards
      sources: [2003 Brazilian Grand Prix]
    sql: >-
      SELECT driver_name, constructor_name FROM v_race_winners
