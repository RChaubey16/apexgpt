  # --- multi-hop: both tools, or chained lookups ---------------------------
  - id: multi-hunt-lauda-points
    category: multi_hop
    question: How did Hunt beat Lauda in 1976 and what were the final points?
    expect:
      answer: ["69", "68"]
      facts:
        - Lauda withdrew from the wet Japanese finale; Hunt finished third
      sources: [1976 Japanese Grand Prix, James Hunt, 1976 Formula One season]
      tools: [query_stats, search_f1_knowledge]
    sql: >-
      SELECT champion_points, runner_up_points FROM v_season_summary WHERE season = 1976

  - id: multi-2009-champion-team-wins
    category: multi_hop
    question: Who won the 2009 title, for which team, and how many races did he win that year?
    expect:
      answer: [Jenson Button, Brawn, "6"]
      tools: [query_stats]
    sql: >-
      SELECT s.champion_name, s.champion_teams, s.champion_wins FROM v_season_summary s
      WHERE s.season = 2009

  - id: multi-champion-year-senna-died
    category: multi_hop
    question: Who won the championship in the year Ayrton Senna died?
    expect:
      answer: [Michael Schumacher, "1994"]
      facts:
        - Schumacher beat Damon Hill by one point
      tools: [query_stats]
    sql: >-
      SELECT season, champion_name, runner_up_name, title_margin FROM v_season_summary
      WHERE season = 1994

  - id: multi-1997-champion-career-wins
    category: multi_hop
    question: How many career wins did the 1997 world champion take?
    expect:
      answer: [Jacques Villeneuve, "11"]
      tools: [query_stats]
    sql: >-
      SELECT d.driver_name, d.wins FROM v_season_summary s
      JOIN v_driver_career d ON d.driver_ref = s.champion_ref WHERE s.season = 1997

  - id: multi-imola-record
    category: multi_hop
    question: Who has won the most races at the circuit where Ayrton Senna died?
    expect:
      answer: [Michael Schumacher, "7"]
      facts:
        - Senna died at Imola (Autodromo Enzo e Dino Ferrari)
      tools: [query_stats]
    sql: >-
      SELECT driver_name, count(*) FROM v_race_winners
      WHERE circuit_name = 'Autodromo Enzo e Dino Ferrari' GROUP BY 1 ORDER BY 2 DESC LIMIT 1

  - id: multi-senna-vs-prost-wins
    category: multi_hop
    question: Who won more races and titles, Senna or Prost?
    expect:
      answer: ["51", "41", "4", "3"]
      facts:
        - Prost won 51 races and 4 titles; Senna won 41 races and 3 titles
      tools: [query_stats]
    sql: >-
      SELECT driver_name, wins, championships FROM v_driver_career
      WHERE driver_ref IN ('prost', 'senna')

  - id: multi-raikkonen-title-to-last-win
    category: multi_hop
    question: How many years passed between Kimi Räikkönen's world title and his last race win?
    expect:
      answer: ["2007", "2018", "11"]
      facts:
        - His last win was the 2018 United States Grand Prix
      tools: [query_stats]
    sql: >-
      SELECT s.season, max(w.season), max(w.season) - s.season FROM v_season_summary s
      JOIN v_race_winners w ON w.driver_ref = s.champion_ref
      WHERE s.champion_ref = 'raikkonen' GROUP BY s.season

  - id: multi-1982-champion-wins
    category: multi_hop
    question: Who won the 1982 championship and how many races did he win that season?
    expect:
