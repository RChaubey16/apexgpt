  - id: stats-distinct-winners
    category: stats
    question: How many different drivers have won a World Championship Grand Prix?
    expect:
      answer: ["115"]
      tools: [query_stats]
    sql: SELECT count(DISTINCT driver_ref) FROM v_race_winners

  - id: stats-monza-record-tie
    category: stats
    question: Who has the most wins at Monza?
    expect:
      answer: [Lewis Hamilton, Michael Schumacher, "5"]
      facts:
        - Hamilton and Schumacher share the record
      tools: [query_stats]
    sql: >-
      SELECT driver_name, count(*) FROM v_race_winners
      WHERE circuit_name = 'Autodromo Nazionale di Monza' GROUP BY 1 ORDER BY 2 DESC LIMIT 2
    known_issue: Answered with Hamilton alone before the "no LIMIT 1" rule (F3.5)

  - id: stats-monaco-record
