        - Ayrton Senna was closing in on Prost in a Toleman when it was stopped
        - Half points were awarded
      sources: [1984 Monaco Grand Prix]
      tools: [search_f1_knowledge]
    sql: >-
      SELECT driver_name FROM v_race_winners
      WHERE season = 1984 AND race_name = 'Monaco Grand Prix'

  - id: races-2003-brazil
