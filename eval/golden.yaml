  - id: races-2008-brazil-finale
    category: races
    question: How did the 2008 Brazilian Grand Prix decide the championship?
    expect:
      answer: [Felipe Massa, Lewis Hamilton]
      facts:
        - Massa won the race
        - Hamilton passed Timo Glock on the final lap to take the fifth place he needed
        - Hamilton won the title by one point
      sources: [2008 Brazilian Grand Prix]
      tools: [search_f1_knowledge]
    sql: >-
      SELECT w.driver_name, s.champion_name FROM v_race_winners w
      JOIN v_season_summary s USING (season)
      WHERE w.season = 2008 AND w.race_name = 'Brazilian Grand Prix'

  - id: races-abu-dhabi-2021
    category: races
    question: Explain Abu Dhabi 2021
    expect:
      answer: [Max Verstappen, Lewis Hamilton]
      facts:
        - A late safety car bunched the field for a final-lap restart
        - Only the lapped cars between Hamilton and Verstappen were allowed to unlap themselves
        - Verstappen, on fresher tyres, passed Hamilton on the last lap to win the race and the title
        - Race director Michael Masi's handling caused controversy and he was later removed
      sources: [2021 Abu Dhabi Grand Prix]
      tools: [search_f1_knowledge]
    known_issue: >-
      Sometimes answered with query_stats only, so no citations (2 of 9 runs during F4.4).

  - id: races-singapore-2008
    category: races
    question: What was Crashgate at the 2008 Singapore Grand Prix?
    expect:
      answer: [Piquet Jr]
      facts:
        - Piquet Jr. crashed deliberately on Renault's orders
        - The safety car helped his team-mate Fernando Alonso win the race
      sources: [2008 Singapore Grand Prix, Renault Formula One crash controversy]
      tools: [search_f1_knowledge]

  - id: races-indianapolis-500
    category: races
    question: Was the Indianapolis 500 ever part of the Formula 1 World Championship?
    expect:
      answer: ["1950", "1960"]
      facts:
        - It counted towards the World Championship from 1950 to 1960
        - Johnnie Parsons won the 1950 Indianapolis 500
      sources: [1950 Indianapolis 500]
    sql: >-
      SELECT min(season), max(season), count(*) FROM v_race_winners
      WHERE race_name = 'Indianapolis 500'

  # --- crashes and safety ----------------------------------------------------
