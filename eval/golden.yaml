      tools: [query_stats]
    sql: >-
      SELECT constructor_name, count(*) FROM v_race_winners
      GROUP BY 1 ORDER BY 2 DESC LIMIT 1

  - id: stats-constructor-most-titles
    category: stats
    question: Which team has won the most constructors' championships?
    expect:
      answer: [Ferrari, "16"]
      tools: [query_stats]
    sql: >-
      SELECT constructors_champion_name, count(*) FROM v_season_summary
      WHERE constructors_champion_name IS NOT NULL GROUP BY 1 ORDER BY 2 DESC LIMIT 1

  - id: stats-british-titles
    category: stats
    question: How many drivers' championships have British drivers won?
    expect:
      answer: ["21"]
      facts:
        - Eleven different British drivers won those titles
      tools: [query_stats]
    sql: >-
      SELECT count(*), count(DISTINCT s.champion_ref) FROM v_season_summary s
      JOIN v_driver_career d ON d.driver_ref = s.champion_ref WHERE d.nationality = 'British'

  - id: stats-youngest-winner
    category: stats
    question: Who is the youngest Grand Prix winner ever?
    expect:
      answer: [Max Verstappen, "18"]
      facts:
        - He won the 2016 Spanish Grand Prix
      tools: [query_stats]
    sql: >-
      SELECT w.driver_name, w.race_name, w.season,
             extract(year FROM age(w.race_date, d.date_of_birth))
      FROM v_race_winners w JOIN v_driver_career d USING (driver_ref)
      ORDER BY w.race_date - d.date_of_birth LIMIT 1

  - id: stats-oldest-winner
    category: stats
    question: Who is the oldest driver to have won a World Championship race?
    expect:
      answer: [Luigi Fagioli, "1951"]
      facts:
        - He won the 1951 French Grand Prix aged 53
      tools: [query_stats]
    sql: >-
      SELECT w.driver_name, w.race_name, w.season,
             extract(year FROM age(w.race_date, d.date_of_birth))
      FROM v_race_winners w JOIN v_driver_career d USING (driver_ref)
      ORDER BY w.race_date - d.date_of_birth DESC LIMIT 1

  - id: stats-teammates-hamilton-alonso-2007
    category: stats
    question: How did Lewis Hamilton and Fernando Alonso compare as McLaren team-mates in 2007?
    expect:
      answer: ["109"]
      facts:
        - Both scored 109 points
        - Both won 4 races
        - Hamilton out-qualified Alonso 9 times to 8
      tools: [query_stats]
    sql: >-
      SELECT qualified_ahead, qualified_behind, wins, teammate_wins, points, teammate_points
      FROM v_head_to_head_teammates
      WHERE season = 2007 AND driver_ref = 'hamilton' AND teammate_ref = 'alonso'

