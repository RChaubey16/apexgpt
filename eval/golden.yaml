# ApexGPT golden question set (F6.1). Schema and rules: backend/evals/golden.py.
#
# - answer:     values that must appear in the answer (case, accents, "5,018.50" vs
#               "5018.5" don't matter; whole words only).
# - sql:        reference query over the loaded data. The corpus test checks that
#               every `answer` value appears in its rows: run
#               CORPUS_DATABASE_URL=… uv run pytest -m corpus tests/corpus/test_golden_set.py
# - facts:      key points for the LLM judge (F6.2); each is supported by the
#               corpus chunks of the listed sources.
# - sources:    Wikipedia article titles (as in the chunks table); a good answer
#               cites at least one.
# - tools:      tools the answer must use.
# - behavior:   answer (default) | decline | correct_premise.
# - standalone: follow-ups only; values the rewritten question must contain.
# - known_issue: why the question is here, if it tracks a known problem.
#
# Data covers the 1950–2025 seasons. Keep answers to what the data supports.

version: 1
questions:
  # --- stats: career and all-time records ---------------------------------
  - id: stats-most-wins
    category: stats
    question: Who has won the most Formula 1 races?
    expect:
      answer: [Lewis Hamilton, "105"]
      tools: [query_stats]
    sql: SELECT driver_name, wins FROM v_driver_career ORDER BY wins DESC LIMIT 1

  - id: stats-most-titles-tie
    category: stats
    question: Which driver has the most world championships?
    expect:
      answer: [Lewis Hamilton, Michael Schumacher, "7"]
      facts:
        - The record is shared between Hamilton and Schumacher, not held by one driver
      tools: [query_stats]
    sql: >-
      SELECT driver_name, championships FROM v_driver_career
      WHERE championships = (SELECT max(championships) FROM v_driver_career)

  - id: stats-most-poles
    category: stats
    question: Who holds the record for the most pole positions?
    expect:
      answer: [Lewis Hamilton, "104"]
      tools: [query_stats]
    sql: SELECT driver_name, poles FROM v_driver_career ORDER BY poles DESC LIMIT 1

  - id: stats-most-podiums
    category: stats
    question: Who has the most podium finishes in F1 history?
    expect:
      answer: [Lewis Hamilton, "202"]
      tools: [query_stats]
    sql: SELECT driver_name, podiums FROM v_driver_career ORDER BY podiums DESC LIMIT 1

  - id: stats-most-starts
    category: stats
    question: Which driver has started the most Grands Prix?
    expect:
      answer: [Fernando Alonso]
      facts:
        - Alonso has about 426 starts (428 entries)
      tools: [query_stats]
    sql: >-
      SELECT driver_name, race_starts, race_entries FROM v_driver_career
      ORDER BY race_starts DESC LIMIT 1

  - id: stats-most-points
    category: stats
    question: Who has scored the most career points?
    expect:
      answer: [Lewis Hamilton, "5018.5"]
      tools: [query_stats]
    sql: >-
      SELECT driver_name, total_points FROM v_driver_career
      ORDER BY total_points DESC LIMIT 1

  - id: stats-most-fastest-laps-since-2004
    category: stats
    question: Who has set the most fastest laps since 2004?
    expect:
      answer: [Lewis Hamilton, "68"]
      tools: [query_stats]
    sql: >-
      SELECT driver_name, fastest_laps_since_2004 FROM v_driver_career
      ORDER BY fastest_laps_since_2004 DESC LIMIT 1

  - id: stats-most-dnfs
