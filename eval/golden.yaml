  # --- trick: the question assumes something false --------------------------
  - id: trick-moss-titles
    category: trick
    question: How many world championships did Stirling Moss win?
    expect:
      behavior: correct_premise
      answer: ["16"]
      facts:
        - Moss never won the championship
        - He won 16 races and was runner-up several times
      tools: [query_stats]
    sql: SELECT championships, wins FROM v_driver_career WHERE driver_ref = 'moss'

  - id: trick-hamilton-ferrari-title
    category: trick
    question: In which year did Lewis Hamilton win the championship with Ferrari?
    expect:
      behavior: correct_premise
      facts:
        - Hamilton has never won a title with Ferrari
        - His seven titles came with McLaren (2008) and Mercedes
      tools: [query_stats]
      answer: [McLaren, Mercedes]
    sql: >-
      SELECT season, champion_teams FROM v_season_summary WHERE champion_ref = 'hamilton'

  - id: trick-senna-ferrari
    category: trick
    question: Which races did Ayrton Senna win for Ferrari?
    expect:
      behavior: correct_premise
      facts:
        - Senna never drove for Ferrari
        - He raced for Toleman, Lotus, McLaren and Williams
      answer: [Toleman, McLaren, Williams]
      tools: [query_stats]
    sql: SELECT teams FROM v_driver_career WHERE driver_ref = 'senna'

  - id: trick-hulkenberg-wins
    category: trick
    question: How many races has Nico Hulkenberg won?
    expect:
      behavior: correct_premise
      answer: ["2025"]
      facts:
        - He has not won a race; his first podium was the 2025 British Grand Prix
      sources: [Nico Hülkenberg, 2025 British Grand Prix]

  - id: trick-monaco-2020
    category: trick
    question: Who won the 2020 Monaco Grand Prix?
    expect:
      behavior: correct_premise
      facts:
        - There was no 2020 Monaco Grand Prix; it was cancelled
    known_issue: No race in the data, so "no rows" must not become a guessed winner

  - id: trick-gilles-villeneuve-title
    category: trick
    question: In which year was Gilles Villeneuve world champion?
    expect:
      behavior: correct_premise
      answer: [Jacques Villeneuve, "1997"]
      facts:
        - Gilles Villeneuve never won the championship
        - His son Jacques Villeneuve won the 1997 title
      tools: [query_stats]
    sql: >-
      SELECT g.championships, s.champion_name, s.season FROM v_season_summary s
      CROSS JOIN v_driver_career g
      WHERE s.champion_ref = 'villeneuve' AND g.driver_ref = 'gilles_villeneuve'

  - id: trick-prost-fifth-title
    category: trick
    question: When did Alain Prost win his fifth world title?
    expect:
      behavior: correct_premise
      answer: ["4"]
      facts:
        - Prost won four titles (1985, 1986, 1989, 1993), not five
      tools: [query_stats]
    sql: SELECT championships FROM v_driver_career WHERE driver_ref = 'prost'

  - id: trick-prost-more-points-1988
    category: trick
    question: Why did Alain Prost lose the 1988 title when he scored fewer points than Senna?
    expect:
      behavior: correct_premise
      answer: ["105", "94"]
      facts:
        - Prost actually scored more points in total (105 to Senna's 94)
        - Only each driver's best 11 results counted, which gave Senna the title 90 to 87
      sources: [1988 Formula One World Championship]
      tools: [query_stats]
    sql: >-
      SELECT points, teammate_points FROM v_head_to_head_teammates
      WHERE season = 1988 AND driver_ref = 'prost' AND teammate_ref = 'senna'

