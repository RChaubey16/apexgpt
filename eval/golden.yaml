    question: Where was the 1982 Swiss Grand Prix held, and who won it?
    expect:
      answer: [Dijon, Keke Rosberg]
      facts:
        - It was held at Dijon-Prenois in France, because circuit racing was banned in Switzerland
      sources: [1982 Swiss Grand Prix]
    sql: >-
      SELECT driver_name, circuit_name FROM v_race_winners
      WHERE season = 1982 AND race_name = 'Swiss Grand Prix'

  - id: races-1984-monaco
