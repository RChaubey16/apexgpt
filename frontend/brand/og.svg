<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>ApexGPT: Formula 1 chat assistant</title>
  <defs>
    <pattern id="checks" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#0b0b0f"/>
      <rect width="20" height="20" fill="#f2f2f5"/>
      <rect x="20" y="20" width="20" height="20" fill="#f2f2f5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0b0b0f"/>
  <!-- The logo tile (brand/icon.svg, scaled 3.5x). -->
  <g transform="translate(96 150) scale(3.5)">
    <rect width="64" height="64" rx="14" fill="#141419"/>
    <g fill="#e10600">
      <path d="M7 50 L17 50 L27 14 L17 14 Z"/>
      <path d="M22 50 L32 50 L42 14 L32 14 Z"/>
      <path d="M37 50 L47 50 L57 14 L47 14 Z"/>
    </g>
  </g>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="372" y="262" font-size="118" font-weight="900" font-style="italic" fill="#f2f2f5" letter-spacing="-3">APEX<tspan fill="#e10600">GPT</tspan></text>
    <text x="376" y="336" font-size="46" font-weight="600" fill="#f2f2f5">Formula 1 chat assistant</text>
    <text x="376" y="392" font-size="31" font-weight="500" fill="#a1a1ad" letter-spacing="1">1950–2025 · drivers, teams, races · cited answers</text>
  </g>
  <rect y="550" width="1200" height="80" fill="url(#checks)" opacity="0.85"/>
  <rect y="546" width="1200" height="4" fill="#e10600"/>
</svg>
