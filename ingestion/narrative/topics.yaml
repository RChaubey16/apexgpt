# Curated topic articles for the narrative corpus (docs/DATA-STRATEGY.md §2b).
#
# Each group maps to a list of English Wikipedia article titles. Every topic is
# fetched in full. A topic that is already selected from the structured data
# (a race report, a driver, a team) is upgraded to the full article and tagged
# with the group, e.g. the 1989 Japanese Grand Prix or Roland Ratzenberger.
#
# Optional metadata, carried onto the article's chunks for search filters:
#   drivers: [refs]   constructors: [refs]   season: 1976   circuit: ref
# Refs are the structured data's `ref` slugs (drivers.ref, constructors.ref,
# circuits.ref); unknown refs fail the selection. Titles that aren't on
# Wikipedia, are disambiguation pages, or duplicate another topic fail
# `python -m narrative.select`.

