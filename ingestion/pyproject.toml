[project]
name = "apexgpt-ingestion"
version = "0.1.0"
description = "ApexGPT offline data pipelines (run on the dev machine): Jolpica-F1 and Wikipedia to Postgres"
requires-python = ">=3.12,<3.14"
dependencies = [
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a real Postgres + pgvector database (set TEST_DATABASE_URL)",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
