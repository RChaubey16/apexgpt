# Install once: pre-commit install
# Run on everything: pre-commit run --all-files
#
# The frontend hooks (Prettier, ESLint) run the versions pinned in
# frontend/package-lock.json, so run `npm ci` in frontend/ first.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black

  # GitHub Actions workflows (also runs shellcheck on `run:` blocks when it is
  # installed; it is preinstalled on GitHub's Ubuntu runners).
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Frontend: run from frontend/ with its own pinned tools. Paths are passed
  # relative to the repo root, so strip the "frontend/" prefix.
  - repo: local
    hooks:
      - id: frontend-prettier
        name: prettier (frontend)
        language: system
        files: ^frontend/
        exclude: ^frontend/(package-lock\.json|AGENTS\.md)$
        entry: bash -c 'cd frontend && npx --no-install prettier --write --ignore-unknown "${@#frontend/}"' --
      - id: frontend-eslint
        name: eslint (frontend)
        language: system
        files: ^frontend/.*\.(ts|tsx|js|mjs|cjs)$
        entry: bash -c 'cd frontend && npx --no-install eslint --max-warnings=0 --fix "${@#frontend/}"' --
